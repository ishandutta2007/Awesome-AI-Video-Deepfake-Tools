<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(-20px, 15px); opacity: 0.6; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.7; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes scanLine {
      0% { transform: translateY(0px); opacity: 0.1; }
      50% { opacity: 0.4; }
      100% { transform: translateY(320px); opacity: 0.1; }
    }
    @keyframes dataStream {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes borderGlow {
      0%, 100% { stroke: #6366f1; stroke-opacity: 0.6; }
      50% { stroke: #ec4899; stroke-opacity: 0.9; }
    }

    .pulsing-orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .pulsing-orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 260px; }
    .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 8s ease-in-out infinite 1.5s; }
    .particle-3 { animation: floatParticle 7s ease-in-out infinite 3s; }
    .scanner { animation: scanLine 6s ease-in-out infinite; }
    .data-wire { stroke-dasharray: 12, 12; animation: dataStream 4s linear infinite; }
    .glow-border { animation: borderGlow 5s ease-in-out infinite; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="18" fill="url(#bg-grad)" />

  <!-- Background Isometric Grid Pattern -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
    <path d="M 0,60 L 1200,60 M 0,120 L 1200,120 M 0,180 L 1200,180 M 0,240 L 1200,240 M 0,300 L 1200,300" />
    <path d="M 120,0 L 120,360 M 240,0 L 240,360 M 360,0 L 360,360 M 480,0 L 480,360 M 600,0 L 600,360 M 720,0 L 720,360 M 840,0 L 840,360 M 960,0 L 960,360 M 1080,0 L 1080,360" />
  </g>

  <!-- Ambient Glowing Energy Orbs in Background -->
  <circle class="pulsing-orb-1" cx="200" cy="100" r="140" fill="url(#cyan-glow)" filter="url(#neon-glow)" />
  <circle class="pulsing-orb-2" cx="1020" cy="240" r="150" fill="url(#primary-glow)" filter="url(#neon-glow)" />

  <!-- Dynamic Data Waveforms & Connectors (Subtle Background Flow) -->
  <g fill="none" opacity="0.45">
    <path class="data-wire" d="M 50,300 Q 300,180 600,290 T 1150,150" stroke="#818cf8" stroke-width="2" />
    <path class="data-wire" d="M 50,70 Q 400,220 750,90 T 1150,280" stroke="#f472b6" stroke-width="2" style="animation-direction: reverse;" />
  </g>

  <!-- Dynamic Animated Scanline (Restricted in subtle region) -->
  <line class="scanner" x1="80" y1="20" x2="1120" y2="20" stroke="url(#primary-glow)" stroke-width="1.5" opacity="0.25" />

  <!-- Floating Modern Micro-Pill Badges (Behind/Flanking Text) -->
  <g class="particle-1" transform="translate(100, 48)">
    <rect width="130" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.85" />
    <text x="65" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ REAL-TIME SYNC</text>
  </g>
  <g class="particle-2" transform="translate(970, 52)">
    <rect width="140" height="28" rx="14" fill="#1e293b" stroke="#c084fc" stroke-width="1" opacity="0.85" />
    <text x="70" y="18" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🎭 NEURAL AVATARS</text>
  </g>
  <g class="particle-3" transform="translate(990, 275)">
    <rect width="125" height="28" rx="14" fill="#1e293b" stroke="#f43f5e" stroke-width="1" opacity="0.85" />
    <text x="62" y="18" fill="#fb7185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">🔮 4K GENERATION</text>
  </g>

  <!-- Main Hero Card Container (Ensuring foreground title and subtitle are 100% visible and prominent) -->
  <g transform="translate(150, 68)" filter="url(#soft-shadow)">
    <!-- Glassmorphic Card Frame -->
    <rect width="900" height="225" rx="16" fill="url(#card-grad)" class="glow-border" stroke="#6366f1" stroke-width="1.5" />
    
    <!-- Top Pill Category Header -->
    <g transform="translate(450, 42)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#312e81" stroke="#818cf8" stroke-width="1" />
      <text x="0" y="4" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5" text-anchor="middle">✨ CURATED AI VIDEO DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="450" y="108" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5" text-anchor="middle">
      Awesome AI Video &amp; Deepfake Tools
    </text>

    <!-- Subtitle -->
    <text x="450" y="148" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" text-anchor="middle">
      Enterprise SaaS Platforms, Open-Source Face Swap &amp; Talking-Head Synthesis
    </text>

    <!-- Bottom Feature Badges / Highlights inside Hero Card -->
    <g transform="translate(450, 188)">
      <!-- Badge 1: Face Swap -->
      <g transform="translate(-240, 0)">
        <rect x="-65" y="-12" width="130" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="0" y="4" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">🔄 Face Swapping</text>
      </g>
      <!-- Badge 2: Talking Heads -->
      <g transform="translate(-75, 0)">
        <rect x="-70" y="-12" width="140" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="0" y="4" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">🗣️ Talking Heads</text>
      </g>
      <!-- Badge 3: Real-Time Stream -->
      <g transform="translate(90, 0)">
        <rect x="-65" y="-12" width="130" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="0" y="4" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">🎥 Live Streaming</text>
      </g>
      <!-- Badge 4: Generative Models -->
      <g transform="translate(250, 0)">
        <rect x="-65" y="-12" width="130" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="0" y="4" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">🚀 Video Gen AI</text>
      </g>
    </g>
  </g>
</svg>
